# Run on Windows. Set DART_API_TOKEN in the service environment.
# Use a persistent writable working directory for the DB and buffer.
[SERVICE]
    Flush          1
    Log_Level      info
    storage.path   ./buffer

[INPUT]
    Name           winlog
    Channels       Security,System,Application
    Interval_Sec   1
    DB             ./winlog.db
    Tag            windows.events
    storage.type   filesystem

[OUTPUT]
    Name           http
    Match          windows.*
    Host           127.0.0.1
    Port           8000
    URI            /collect/windows-ad?asset_type=server&vendor=Microsoft
    Format         json_lines
    Header         X-API-Key ${DART_API_TOKEN}
    Retry_Limit    no_limits
# For a remote HTTPS endpoint: configure Host, Port 443, tls On and CA verification.
