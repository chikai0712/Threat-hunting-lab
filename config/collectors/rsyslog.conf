# Example snippet: use only where existing rules do not already forward logs.
# Replace the documentation-only target IP. Validate with rsyslogd -N1.
# Ensure global(workDirectory="/var/spool/rsyslog") exists in the main config.
action(
    type="omfwd"
    target="192.0.2.10"
    port="5514"
    protocol="tcp"
    TCP_Framing="octet-counted"
    template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1"
    queue.type="LinkedList"
    queue.filename="threat-hunting-forward"
    queue.maxDiskSpace="1g"
    queue.saveOnShutdown="on"
)
