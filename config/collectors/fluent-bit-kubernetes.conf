# Merge into a Fluent Bit deployment with readonly /var/log mounts.
# Replace Host; inject DART_API_TOKEN through a Kubernetes Secret.
[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    storage.path    /buffers

[INPUT]
    Name            tail
    Path            /var/log/containers/*.log
    Tag             kube.*
    multiline.parser docker, cri
    DB              /buffers/containers.db
    Read_from_Head  false
    Mem_Buf_Limit   5MB
    storage.type    filesystem

[OUTPUT]
    Name            http
    Match           kube.*
    Host            threat-lab-api
    Port            8000
    URI             /collect/kubernetes?asset_type=application&product=Kubernetes
    Format          json_lines
    Header          X-API-Key ${DART_API_TOKEN}
    Retry_Limit     no_limits
