services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DART_API_TOKEN: ${DART_API_TOKEN:?Set DART_API_TOKEN in .env}
      DART_DB_PATH: /data/dart.db
    volumes:
      - dart-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  dart-data:
