name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: DART_API_TOKEN=ci-only-placeholder-token-32-chars docker compose config --quiet
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dart-lab:ci .
      - name: Start source receiver container
        run: >-
          docker run -d --name threat-lab-test
          -e DART_API_TOKEN=ci-only-placeholder-token-32-chars
          -e FORTINET_IPS=127.0.0.1
          dart-lab:ci
      - name: Verify environment-configured push API
        run: |
          docker exec -i threat-lab-test python - <<'PYTHON'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=1):
                      break
              except URLError:
                  time.sleep(0.2)
          request = Request("http://127.0.0.1:8000/api/v1/logs/fortinet",
                            data=b"action=deny srcip=192.0.2.1",
                            headers={"Content-Type": "text/plain"})
          with urlopen(request, timeout=5) as response:
              result = json.load(response)
          assert result["records"][0]["normalized"]["source_ip"] == "192.0.2.1"
          PYTHON
      - name: Stop test container
        if: always()
        run: docker rm -f threat-lab-test
